<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>
<body>
    <h2>Cadastro de Nomes</h2>
    <input type="text" id="nome" placeholder="Digite um nome">
    <button onclick="adicionar()">cadastrar</button>
    <button onclick="mostrar()">Mostrar lista</button>
    <p id="resultado"></p>
    <script>
        let nomes= [];

        function adicionar(){
            let nome = document.getElementById("nome").value;
            if(nome !=""){
                nomes.push(nome);
                document.getElementById("nome").value="";
            }
        }
        function mostrar(){
            let texto = `Nomes cadastrados: \n`
            for(let i=0; i<nomes.length; i++){
                texto += `${nomes[i]} \n`
            }
            document.getElementById('resultado').innerText = texto;
        }
    </script>
</body>
</html>
